{% extends "base.html" %}

{% block content %}
<div class="row">
    <div class="col-md-12">
        <div class="card shadow">
            <div class="card-header d-flex justify-content-between align-items-center bg-primary text-white">
                <h4 class="mb-0">Live Attendance Feed</h4>
                <a href="{{ url_for('attendance.stop_camera') }}" id="stopBtn" class="btn btn-sm btn-danger">Stop Camera</a>
            </div>
            <div class="card-body text-center">
                <img src="{{ url_for('attendance.video_feed') }}" class="img-fluid border border-dark rounded" style="max-height: 70vh;" alt="Video Feed">
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.getElementById('stopBtn').addEventListener('click', function(e) {
        e.preventDefault();
        fetch(this.href).then(() => {
            window.location.href = "{{ url_for('dashboard.index') }}";
        });
    });
</script>
{% endblock %}
